providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

env:
  APP_NAME: "Testbench"

migrations:
  - workbench/database/migrations

workbench:
  discovers:
    config: true
    factories: true
    web: true
    api: true
    commands: true
    views: true
  sync:
    - from: storage
      to: workbench/storage
      reverse: true

purge:
  directories: public/vendor/*
